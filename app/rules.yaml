# Правила контроля кассовой дисциплины.
#
# ПОЛЕ verified
#   true  — текст пункта сверен ДОСЛОВНО по правовой базе, цитата ниже точная
#   false — не сверен либо норма приостановлена; как основание не использовать
#
# Статус сверки на 2026-10-17:
#   ПП НБРК №231 п.12, п.20 — сверены по ДВУМ независимым источникам
#                             (zakon.uchet.kz и bizup.kz), тексты совпали
#   ПП НБРК №231 п.35       — сверен по одному источнику (zakon.uchet.kz)
#   ПП НБРК №14  п.16       — НЕ сверен: пункт ПРИОСТАНОВЛЕН до 01.01.2027
#                             постановлением от 24.12.2024 №88, редакция
#                             периода приостановления в открытых зеркалах
#                             не опубликована
#
# adilet.zan.kz отдаёт страницы только через JavaScript и машинно не читается;
# сверка велась по правовым базам, перепубликующим тот же текст.
#
# Условия — КОНЪЮНКЦИИ. Одиночный признак даёт ложные срабатывания:
#   X-29 размечено "без нарушения", хотя кассир встаёт и отходит от стола
#   X-16 размечено "без нарушения", хотя содержит передачу инкассаторской сумки

# Нейтральные промпты — общий контраст для всех семантических правил.
# Вероятность правила = softmax(его промпт против этих трёх).
clip_neutral:
  - "a bank teller sitting and working at the desk"
  - "a bank teller talking with a customer at the counter"
  - "an ordinary office room"

documents:
  nbrk_231:
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот,
      монет и ценностей в банках второго уровня, филиалах банков-нерезидентов РК,
      Национальном операторе почты и юридических лицах, исключительной
      деятельностью которых является инкассация
    act: Постановление Правления Национального Банка РК от 29.11.2019 № 231
    url: https://adilet.zan.kz/rus/docs/V1900019680
  nbrk_14:
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня,
      филиалов банков-нерезидентов РК, Национального оператора почты и
      юридических лиц, осуществляющих инкассацию
    act: Постановление Правления Национального Банка РК от 24.02.2020 № 14
    url: https://adilet.zan.kz/rus/docs/V2000020075

rules:
  # --------------------------------------------------------------- сверено
  - id: R2_personal_belongings
    type: Личные вещи в кассовом узле
    enabled: true
    document: nbrk_231
    clause: п. 12
    quote: >-
      Хранение личных вещей, наличных денег и ценностей работников банка
      осуществляется вне кассового узла в порядке, установленном внутренними
      документами банка. Допускается внос работниками банка в кассовый узел
      лекарственных средств, медицинских изделий и средств связи, не имеющих
      функции фото и видео фиксации.
    verified: true
    timecode: at_peak
    # Порог = 75-й перцентиль max-p по датасету: правило срабатывает примерно
    # на четверти роликов, а не на всех подряд.
    clip:
      prompt: "a personal handbag lying on the desk"
      threshold: 0.0102

  - id: R3_mobile_phone
    type: Мобильный телефон на рабочем месте кассира
    enabled: true
    document: nbrk_231
    clause: п. 12
    quote: >-
      Допускается внос работниками банка в кассовый узел лекарственных средств,
      медицинских изделий и средств связи, не имеющих функции фото и видео
      фиксации.
    verified: true
    weak: true
    # ВАЖНО: норма НЕ запрещает телефон как таковой — запрещены средства связи
    # С функцией фото/видеофиксации. Есть ли камера у конкретного устройства,
    # по видео не определить. Поэтому вывод подаётся как повод для проверки,
    # а не как установленное нарушение (п.7 ограничений ТЗ).
    caveat: >-
      Пункт 12 допускает внос средств связи без функции фото- и видеофиксации.
      Наличие камеры у устройства по видеозаписи не устанавливается, поэтому
      факт нарушения требует проверки человеком.
    timecode: at_peak
    clip:
      prompt: "a bank teller looking at a mobile phone in their hands"
      threshold: 0.2142

  - id: R4_food_drink
    type: Еда или напитки на рабочем месте кассира
    enabled: true
    document: nbrk_231
    clause: п. 12
    quote: >-
      Хранение личных вещей, наличных денег и ценностей работников банка
      осуществляется вне кассового узла в порядке, установленном внутренними
      документами банка. Допускается внос работниками банка в кассовый узел
      лекарственных средств, медицинских изделий и средств связи, не имеющих
      функции фото и видео фиксации.
    verified: true
    weak: true
    # Пункт 12 перечисляет ИСЧЕРПЫВАЮЩИЙ список того, что разрешено вносить:
    # лекарства, медизделия, средства связи. Еда и напитки в него не входят.
    # Но пункт говорит о "хранении", а не о разовом употреблении — трактовка
    # остаётся расширительной, поэтому weak.
    caveat: >-
      Пункт 12 прямо перечисляет разрешённое к вносу (лекарственные средства,
      медицинские изделия, средства связи); еда и напитки в перечень не входят.
      Норма при этом говорит о хранении личных вещей, а не о разовом
      употреблении, поэтому трактовка расширительная.
    timecode: at_peak
    clip:
      # Промпт про ПРЕДМЕТ на столе, а не про действие: по замерам
      # (evalkit/prompt_search.py) попадание пика в ±3 с от GT выросло
      # с 7/21 до 13/21 при той же норме.
      prompt: "a paper coffee cup standing on the working desk"
      threshold: 0.0004

  - id: R9_left_workplace
    type: Кассир покинул рабочее место до окончания обслуживания клиента
    enabled: true
    document: nbrk_231
    clause: п. 22
    quote: >-
      Кассовому работнику не допускается покидать рабочее место до окончания
      обслуживания клиента.
    verified: true
    weak: true
    # Норма условная: уход запрещён именно ДО ОКОНЧАНИЯ обслуживания клиента.
    # Завершена ли операция, по видео не определяется, поэтому вывод подаётся
    # как повод для проверки (п.7 ограничений ТЗ).
    #
    # Конъюнкция "уход + клиент в кадре" проверялась и НЕ улучшила разделение
    # (разрыв +0.034 в обоих случаях): счётчик людей зашумлён фигурами за
    # стеклянной перегородкой. Поэтому условие оставлено одиночным.
    caveat: >-
      Пункт 22 запрещает покидать рабочее место до окончания обслуживания
      клиента. Завершено ли обслуживание на момент ухода, по видеозаписи не
      устанавливается, поэтому требуется проверка человеком.
    timecode: at_peak
    clip:
      prompt: "a bank teller standing up and walking away from the desk"
      threshold: 0.9950

  - id: R1_unsecured_valuables
    type: Ранее принятые наличные не убраны в запираемое устройство
    # ВЫКЛЮЧЕНО: сигнал отсутствия кассира эмпирически не разделяет классы
    # (0.54 с против 0.46 с), см. README Шаг 2.
    #
    # Сверка нормы объяснила, ПОЧЕМУ "деньги на столе" сами по себе не являются
    # нарушением: п.20 прямо говорит, что наличные деньги клиента НА рабочем
    # месте кассира находиться должны. Убирать в запираемое устройство надо
    # только РАНЕЕ ПРИНЯТЫЕ деньги. Отличить одни от других по видео нельзя.
    enabled: false
    document: nbrk_231
    clause: п. 20
    quote: >-
      Наличные деньги принимаются и пересчитываются кассовым работником в
      присутствии клиента. На рабочем месте кассового работника находятся
      наличные деньги клиента. Все ранее принятые наличные деньги хранятся в
      специальных устройствах, находящихся на рабочем месте кассового
      работника, закрывающихся на ключ, предназначенных для хранения наличных
      денег (металлический шкаф, сейф, тележка, ящики стола, тумба).
    verified: true
    timecode: at_start
    all:
      - {signal: cashier_present, equals: false, min_duration_s: 3.0}
      - any:
          - {signal: objects_on_desk.cash, gt: 0.5}
          - {signal: safe_open, equals: true}

  - id: R8_unattended_item_on_desk
    type: Предмет оставлен на рабочем месте без присмотра
    # Детектор app/desk.py. Точность конъюнкции 62% против базовых 52% —
    # сигнал слабый, поэтому выключено. См. LIMITATIONS.md разд. 2.
    enabled: false
    document: nbrk_231
    clause: п. 20
    quote: >-
      Все ранее принятые наличные деньги хранятся в специальных устройствах,
      находящихся на рабочем месте кассового работника, закрывающихся на ключ,
      предназначенных для хранения наличных денег (металлический шкаф, сейф,
      тележка, ящики стола, тумба).
    verified: true
    caveat: >-
      По видео невозможно отличить наличные деньги клиента по текущей операции
      (их нахождение на рабочем месте пункт 20 допускает) от ранее принятых
      денег, подлежащих хранению в запираемом устройстве.
    timecode: at_start
    desk_object:
      unattended: true
      min_duration_s: 2.0

  - id: R7_client_left_without_count
    type: Клиент отошёл от кассы, не пересчитав наличные
    enabled: false              # нужна детекция передачи купюр
    document: nbrk_231
    clause: п. 35
    quote: >-
      Клиент пересчитывает полученные наличные деньги, не отходя от кассы, или
      в помещении для пересчета наличных денег клиентами в присутствии
      кассового работника или контролирующего работника.
    verified: true
    timecode: at_start
    all:
      - {signal: cash_issued_to_client, equals: true}
      - {signal: client_present, equals: false, within_s: 3.0}

  - id: R6_no_count_in_presence
    type: Наличные не пересчитаны в присутствии клиента
    enabled: false              # нужна детекция пересчёта
    document: nbrk_231
    clause: п. 20
    quote: >-
      Наличные деньги принимаются и пересчитываются кассовым работником
      в присутствии клиента.
    verified: true
    timecode: at_start
    all:
      - {signal: cash_handover, equals: true}
      - {signal: counting_detected, equals: false, window_s: 8.0}
      - {signal: client_present, equals: true}

  # ------------------------------------------------------- НЕ сверено
  - id: R5_unauthorized_person
    type: Посторонний в зоне кассы
    # ВЫКЛЮЧЕНО по двум независимым причинам:
    #  1) эмпирически срабатывало на 100% роликов — клиент у стойки это норма;
    #  2) ЮРИДИЧЕСКИ: пункт 16 ПП №14 ПРИОСТАНОВЛЕН до 01.01.2027
    #     постановлением от 24.12.2024 №88. Редакция периода приостановления
    #     в открытом доступе не найдена, поэтому ссылаться на него нельзя.
    #     Перед включением правила найти действующую редакцию.
    enabled: false
    document: nbrk_14
    clause: п. 16 (приостановлен до 01.01.2027)
    quote: ""
    verified: false
    timecode: at_start
    all:
      - {signal: persons_in_cash_zone, gt: 1, min_duration_s: 2.0}
      - {signal: cashier_present, equals: true}
